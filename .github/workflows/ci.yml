name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx hardhat compile
      - run: npx hardhat test
      # Typecheck separately so a scripts-only regression cannot ride in behind green tests.
      - run: npx tsc --noEmit -p tsconfig.json
